id: docs_paragraph_callout
label: 'Documentation callout blocks'
migration_group: druxt_docs
source:
  plugin: docs_block
  types:
    - callout
process:
  uuid:
    plugin: docs_identity
    kind: paragraph
    source:
      - page
      - index
  langcode:
    plugin: default_value
    default_value: en
  'field_callout/value': markdown
  'field_callout/format':
    plugin: default_value
    default_value: docs_markdown
  field_callout_type: callout
destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: docs_callout
