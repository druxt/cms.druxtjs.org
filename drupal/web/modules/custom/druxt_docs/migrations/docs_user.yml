id: docs_user
label: 'Documentation authors'
migration_group: druxt_docs
# The people who author the documentation. No email address and no
# password here: the repository is mirrored publicly, and an account is
# claimed on the live site with a one-time login link.
source:
  plugin: embedded_data
  data_rows:
    -
      id: stuart-clark
      name: 'Stuart Clark'
      roles:
        - administrator
  ids:
    id:
      type: string
process:
  uuid:
    plugin: docs_identity
    kind: user
    source: id
  name: name
  roles: roles
  status:
    plugin: default_value
    default_value: 1
  langcode:
    plugin: default_value
    default_value: en
destination:
  plugin: entity:user
