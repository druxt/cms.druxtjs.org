id: docs_paragraph_image
label: 'Documentation image blocks'
migration_group: druxt_docs
source:
  plugin: docs_block
  types:
    - image
process:
  uuid:
    plugin: docs_identity
    kind: paragraph
    source:
      - page
      - index
  langcode:
    plugin: default_value
    default_value: en
  field_media:
    plugin: migration_lookup
    migration: docs_media
    source: src
    no_stub: true
destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: docs_image
migration_dependencies:
  required:
    - docs_media
