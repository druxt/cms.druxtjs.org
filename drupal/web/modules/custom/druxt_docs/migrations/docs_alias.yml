id: docs_alias
label: Documentation path aliases
migration_group: druxt_docs
migration_dependencies:
  required:
  - docs_page
source:
  plugin: docs_document
  constants:
    prefix: /node/
process:
  uuid:
    plugin: docs_identity
    kind: alias
    source: source
  _nid:
    plugin: migration_lookup
    migration: docs_page
    source: source
    no_stub: true
  path:
    plugin: concat
    source:
    - constants/prefix
    - '@_nid'
  alias: url
  langcode:
    plugin: default_value
    default_value: en
destination:
  plugin: entity:path_alias
