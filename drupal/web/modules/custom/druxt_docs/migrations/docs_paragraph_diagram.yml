id: docs_paragraph_diagram
label: 'Documentation diagram blocks'
migration_group: druxt_docs
source:
  plugin: docs_block
  types:
    - diagram
process:
  uuid:
    plugin: docs_identity
    kind: paragraph
    source:
      - page
      - index
  langcode:
    plugin: default_value
    default_value: en
  field_diagram: diagram
  field_syntax: syntax
  # Grouping is content, in a field, rather than a wrapper around the
  # blocks. That is what lets the frontend compose a row of diagrams from
  # what it reads instead of from markup the model does not store.
  field_group: group
destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: docs_diagram
