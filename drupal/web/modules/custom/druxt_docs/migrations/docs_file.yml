id: docs_file
label: 'Documentation image files'
migration_group: druxt_docs
source:
  plugin: docs_image
  constants:
    directory: 'public://documentation/'
process:
  # Order matters: uri reads @_destination, so _destination is built first.
  _destination:
    plugin: concat
    source:
      - 'constants/directory'
      - basename
  # Copied rather than referenced. The build directory is temporary and the
  # file has to outlive it.
  #
  # No hash comparison, unlike the importer this replaces. That check
  # existed because the importer ran on every pipeline and a needless
  # rewrite dirtied the Tome export each time. Migrate does not re-run a
  # row already in its map, so a plain re-import copies nothing at all.
  # Only --update copies again, and it rewrites all sixteen with identical
  # content and a moved mtime, which is what asking for an update means.
  # Measured on 2026-09-10 rather than assumed.
  uri:
    plugin: file_copy
    source:
      - path
      - '@_destination'
  uuid:
    plugin: docs_identity
    kind: file
    source: src
  filename: basename
  status:
    plugin: default_value
    default_value: 1
destination:
  plugin: entity:file
