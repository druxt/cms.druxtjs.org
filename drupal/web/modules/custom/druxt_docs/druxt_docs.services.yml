services:
  druxt_docs.frontend_redirect:
    class: Drupal\druxt_docs\EventSubscriber\FrontendRedirectSubscriber
    arguments: ['@current_user', '@path_alias.manager']
    tags:
      - { name: event_subscriber }
  druxt_docs.login_theme:
    class: Drupal\druxt_docs\Theme\LoginThemeNegotiator
    arguments: ['@config.factory']
    tags:
      - { name: theme_negotiator, priority: 10 }
